<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Google Trends Controller</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
        }
        button {
            width: 260px;
            padding: 14px;
            margin: 10px 0;
            font-size: 16px;
            cursor: pointer;
        }
        #output {
            margin-top: 20px;
            white-space: pre-wrap;
            background: #f5f5f5;
            padding: 12px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<h2>Google Trends API</h2>

<button onclick="callApi('/get_daily_trends', 'GET')">
    GET /get_daily_trends
</button><br>

<button onclick="callApi('/get_daily_trends/refresh', 'POST')">
    POST /get_daily_trends/refresh
</button><br>

<button onclick="callApi('/get_all_trends', 'GET')">
    GET /get_all_trends
</button>

<div id="output"></div>

<script>
async function callApi(url, method) {
    const output = document.getElementById("output");
    output.textContent = "Loading...";

    try {
        const res = await fetch(url, { method });
        const contentType = res.headers.get("content-type");
        if (contentType && contentType.includes("application/json")) {
            const json = await res.json();
            output.textContent = JSON.stringify(json, null, 2);
        } else {
            const text = await res.text();
            output.textContent = text;
        }
    } catch (err) {
        output.textContent = "Error: " + err;
    }
}
</script>

</body>
</html>
